# =============================================================================
# MS-ORDERS CONFIGURATION
# =============================================================================
spring.application.name=ms-orders
server.port=${SERVER_PORT:${PORT:8003}}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:orders_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Health Checks and Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Security and Secret Keys
security.jwt.secret=${JWT_SECRET:}
security.internal.token=${INTERNAL_TOKEN:${INTERNAL_SERVICE_KEY:}}

# External Services Endpoints
services.events.url=${SERVICES_EVENTS_URL:${EVENTS_SERVICE_URL:http://localhost:8002}}
services.payments.url=${SERVICES_PAYMENTS_URL:${PAYMENTS_SERVICE_URL:http://localhost:8004}}
services.tickets.url=${SERVICES_TICKETS_URL:${TICKETS_SERVICE_URL:http://localhost:8005}}
services.notifications.url=${SERVICES_NOTIFICATIONS_URL:${NOTIFICATIONS_SERVICE_URL:http://localhost:8006}}

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.entradasya.orders=${LOG_LEVEL:INFO}
