spring.application.name=ms-orders-test
server.port=8003

# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:orders_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Security and Secret Keys for test
security.jwt.secret=super-secure-shared-secret-entradasya-2026-test-key-long
security.internal.token=internal-service-secret-entradasya-2026

# External Services Endpoints
services.events.url=http://localhost:8002
services.payments.url=http://localhost:8004
services.tickets.url=http://localhost:8005
services.notifications.url=http://localhost:8006

logging.level.root=WARN
logging.level.com.entradasya.orders=INFO
